name: CI pour les pull et push dans master

on:
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-22.04

    environment: labo-dev

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout du   code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run migration
        run: npx prisma generate

      - name: Login to Docker hub to push images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build images to push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:${{ github.sha }}